<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIGER SECURITY LAB</title>
<style>
:root {
  --bg:#07110d;
  --panel:#101f18;
  --green:#35ff8a;
  --muted:#a1b8aa;
  --border:#24513a;
  --red:#ff6262;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:#eafff0;
  font-family:Arial,sans-serif;
  line-height:1.5;
}
header {
  padding:24px 16px;
  text-align:center;
  background:#0b1911;
  border-bottom:2px solid var(--green);
}
header h1 {
  color:var(--green);
  font-size:27px;
  margin:0;
  letter-spacing:1px;
}
header p { color:var(--muted); margin:8px 0 0; }
main { max-width:900px; margin:auto; padding:16px; }
.notice {
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0c1912;
  margin-bottom:18px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:17px;
}
h2 { color:var(--green); font-size:19px; margin-top:0; }
p { color:#d4e5d9; }
button,.button {
  display:inline-block;
  width:100%;
  padding:12px;
  margin-top:9px;
  background:#123d26;
  color:var(--green);
  border:1px solid var(--green);
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
